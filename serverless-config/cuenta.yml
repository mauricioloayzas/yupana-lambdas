cuentas-create:
  handler: services/cuentas/create.php
  runtime: php-84
  layers:
    - ${self:custom.vendorLayerArn}
  description: "Crea una cuenta en el catálogo maestro NIIF (solo lo usa el seed)"
  events:
    - httpApi:
        method: POST
        path: /cuentas
        authorizer: cognitoAuthorizer

cuentas-getAll:
  handler: services/cuentas/getAll.php
  runtime: php-84
  layers:
    - ${self:custom.vendorLayerArn}
  description: "Lista el catálogo maestro NIIF"
  events:
    - httpApi:
        method: GET
        path: /cuentas
        authorizer: cognitoAuthorizer
